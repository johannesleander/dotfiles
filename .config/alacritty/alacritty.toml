[window]
# opacity = 0.9
decorations = "none"

[font]
normal = { family = "FiraCode Nerd Font", style = "Regular" }
bold = { family = "FiraCode Nerd Font", style = "Bold" }
italic = { family = "FiraCode Nerd Font", style = "Italic" }
bold_italic = { family = "FiraCode Nerd Font", style = "Bold Italic" }
size = 18.0

[colors.primary]
background = "#000000"

[keyboard]
bindings = [
  # Option + Arrow keys (move by word)
  { key = "Left",  mods = "Alt",     chars = "\u001bb" },
  { key = "Right", mods = "Alt",     chars = "\u001bf" },

  # Command + Arrow keys (move to start/end of line)
  { key = "Left",  mods = "Command", chars = "\u0001" }, # Ctrl-A
  { key = "Right", mods = "Command", chars = "\u0005" }, # Ctrl-E
]

[env]
TERM = "xterm-256color"
